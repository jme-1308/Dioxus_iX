async function run(){if(!ready||busy)return;busy=true;byId('status').dataset.run='running';const phases=[],running=[];try{for(const rev of spec.revisions){await setRevision(rev.id);running.push({id:rev.id,revision:rev.revision,rows:await runningFacts()});await pauseAll(0);phases.push({id:rev.id,revision:rev.revision,rows:items.map(capture),consumers:consumerItems.map(captureConsumer)})}const motionRows=await motion();const result={ok:true,revision:spec.revision,fixture:spec.fixture,phases,running,motion:motionRows,errors:errors.slice(),journal:journal.slice(),limits:['Authored semantic tokens and system fonts; not full Brand metrics','Native CSSAnimation running/currentTime then paused0 and nine native seeks; not wall-clock pacing certification','Source private animation identifiers and custom-host attributes retained separately','No full physical/AT/reduced-motion/OS/platform certification']};byId('result').textContent=JSON.stringify(result);byId('status').dataset.run='done';byId('status').textContent='112 source Spinner observations, 62 consumer rows and 36 native motion samples';return result}catch(error){errors.push(String(error));const result={ok:false,error:String(error),phases,running,errors:errors.slice(),journal:journal.slice()};byId('result').textContent=JSON.stringify(result);byId('status').dataset.run='done';return result}finally{busy=false}}
window.ixSpinnerReview={spec,run,setRevision,motion,capture:()=>items.map(capture),errors};window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));byId('run').onclick=run;byId('baseline').onclick=async()=>{await setRevision('baseline');await pauseAll(0)};byId('revised').onclick=async()=>{await setRevision('revised');await pauseAll(0)};byId('motion').onclick=motion;
try{await customElements.whenDefined('ix-spinner');for(const d of spec.cases)items.push(constructItem(d,byId('matrix')));for(const d of spec.consumers)consumerItems.push(constructConsumer(d,byId('consumers')));await readiness();await receipt();await settle('source-initial-running');ready=true;byId('status').dataset.ready='true';byId('status').textContent='Ready: 56 source Spinner cases and 31 consumers';for(const id of ['run','baseline','revised','motion'])byId(id).disabled=false}catch(error){errors.push(String(error));byId('status').textContent='Source initialization failed: '+error}
