const byId=id=>document.getElementById('typography-'+id),scopes=[],rows=[],errors=[],journal=[];
let ready=false,busy=false,phase='baseline',sequence=0;
const phaseById=id=>spec.phases.find(p=>p.id===id);
function log(kind,data={}){journal.push({seq:++sequence,kind,time:performance.now(),...data});}
function tokens(scope,index,revision){for(const[i,format]of spec.formats.entries()){const size=12+2*(i%8)+index+2*revision,weight=format.includes('sbold')||format==='h5-bold'?600:400,family=format.startsWith('code')?'ui-monospace, monospace':revision===0?'system-ui, sans-serif':'serif';scope.style.setProperty('--si-sys-typography-'+format,`${weight} ${size}px/${size+8}px ${family}`);}scope.style.setProperty('--si-ref-typography-letter-spacing-normal',`${0.25+0.25*revision}px`);scope.style.setProperty('--si-ref-typography-font-weight-bold',String(700+100*revision));for(const[k,token]of spec.colorTokens.entries())scope.style.setProperty('--si-sys-color-'+token,`rgb(${24+11*k+5*index+3*revision}, ${32+7*k+3*index+5*revision}, ${48+5*k+7*index+2*revision})`);scope.style.color=spec.sentinel.inheritedColor;scope.dataset.scopeIndex=String(index);scope.dataset.revision=String(revision);scope.dataset.ixColorSchema=index>=2?'dark':'light';scope.dataset.ixDensity=index%2===1?'compact':'normal';scope.dataset.ixTheme='brand';}
function specimen(scope,id,kind,key,props){const wrap=document.createElement('div');wrap.className='specimen';const label=document.createElement('span');label.className='specimen-label';label.textContent=kind+' / '+key;const node=document.createElement('ix-typography');node.id=id;node.dataset.typographyKind=kind;node.dataset.typographyKey=key;for(const[k,v]of Object.entries(props))if(v!==null)node[k]=v;node.textContent='Aa 0123 — '+key;wrap.append(label,node);scope.append(wrap);const item={node,scope:scope.dataset.scopeId,kind,key,props:{format:null,textColor:null,bold:false,textDecoration:'none',...props}};rows.push(item);return item;}
function construct(){for(const entry of spec.scopes){const scope=document.createElement('section');scope.id='typo-scope-'+entry.id;scope.dataset.scopeId=entry.id;scope.className='scope';const title=document.createElement('h2');title.className='scope-title';title.textContent=entry.id;scope.append(title);byId('matrix').append(scope);scopes.push({entry,node:scope});tokens(scope,entry.index,0);for(const format of spec.formats)specimen(scope,`typo-${entry.id}-format-${format}`,'format',format,{format});for(const role of spec.colorRoles)specimen(scope,`typo-${entry.id}-color-${role}`,'color',role,{format:'body',textColor:role});for(const extra of spec.extras){const props={format:extra==='default-format'?null:'body'};if(extra==='bold')props.bold=true;if(extra==='underline'||extra==='line-through')props.textDecoration=extra;specimen(scope,`typo-${entry.id}-extra-${extra}`,'extra',extra,props);}}
const nested=document.createElement('section');nested.className='nested';nested.dataset.scopeId='nested-isolated';nested.id='typo-scope-nested-isolated';scopes[0].node.append(nested);tokens(nested,3,0);specimen(nested,spec.ids.nested,'nested','body',{format:'body',textColor:'soft'});}
function computedRow(item){const n=item.node,cs=getComputedStyle(n),r=n.getBoundingClientRect(),scope=n.closest('[data-scope-id]');return{id:n.id,scope:item.scope,scopeIndex:Number(scope.dataset.scopeIndex),revision:Number(scope.dataset.revision),kind:item.kind,key:item.key,...item.props,attrs:Object.fromEntries([...n.attributes].map(a=>[a.name,a.value])),class:n.className,computed:Object.fromEntries(spec.computedSchema.map(k=>[k,cs[k]])),rect:{x:r.x,y:r.y,width:r.width,height:r.height},text:n.textContent,sourceProperties:{format:n.format??null,textColor:n.textColor??null,bold:n.bold,textDecoration:n.textDecoration},resolvedTokens:{font:cs.getPropertyValue('--si-sys-typography-'+(n.format??'body')).trim(),letterSpacing:cs.getPropertyValue('--si-ref-typography-letter-spacing-normal').trim(),bold:cs.getPropertyValue('--si-ref-typography-font-weight-bold').trim(),color:n.textColor?cs.getPropertyValue('--si-sys-color-'+spec.colorMap[n.textColor]).trim():null}};}
function snapshot(){return{id:phase,rows:rows.map(computedRow),scopes:scopes.map(({entry,node})=>({id:entry.id,scopeIndex:Number(node.dataset.scopeIndex),scheme:node.dataset.ixColorSchema,density:node.dataset.ixDensity,revision:Number(node.dataset.revision),supplied:true})),settleFrames:2};}
async function settle(){await document.fonts.ready;for(let index=1;index<=2;index++)await new Promise(resolve=>requestAnimationFrame(timestamp=>queueMicrotask(()=>{log('settle-frame',{index,timestamp,phase});resolve();})));}
async function apply(id){const p=phaseById(id);if(!p)throw Error('Unknown phase '+id);phase=id;log('public-phase-before',{id});for(const{entry,node}of scopes){tokens(node,entry.index===0?p.primaryScopeIndex:entry.index,p.revision);const item=rows.find(r=>r.scope===entry.id&&r.kind==='extra'&&r.key==='reactive');for(const[key,value]of Object.entries(p.reactive)){item.node[key]=value===null?undefined:value;item.props[key]=value;}}await settle();log('public-phase-settled',{id,rows:rows.length});byId('status').textContent='Ready: '+id+' — '+rows.length+' computed specimens';return snapshot();}
function controls(enabled){for(const n of document.querySelectorAll('.controls button'))n.disabled=!enabled;}
function publish(result){byId('result').textContent=JSON.stringify(result,null,2);}
async function command(id){if(!ready||busy)return;busy=true;controls(false);try{const observation=await apply(id);publish({ok:true,revision:spec.revision,fixture:spec.fixture,phases:[observation],errors:[...errors],journal:[...journal],limits});return observation;}catch(error){errors.push(String(error));publish({ok:false,error:String(error),errors:[...errors]});}finally{busy=false;controls(ready);}}
const limits=['Developer-authored tokens establish a semantic adapter comparison; no exact Brand font metric or corporate font claim','Actual source native/custom-host attributes and Rust renderer structure are independent; computed properties are the comparison layer','Fixed2 native RAF plus font readiness are observation horizons, not desired metric waits','No source rebuild, private component state, focus policy, prototype or RAF wrapping'];
async function run(){if(!ready||busy)return;busy=true;controls(false);byId('status').dataset.run='running';const phases=[];try{for(const entry of spec.phases)phases.push(await apply(entry.id));const result={ok:true,revision:spec.revision,fixture:spec.fixture,phases,errors:[...errors],journal:[...journal],limits};publish(result);byId('status').dataset.run='done';return result;}catch(error){errors.push(String(error));const result={ok:false,error:String(error),phases,errors:[...errors]};publish(result);byId('status').dataset.run='done';return result;}finally{busy=false;controls(ready);}}
for(const entry of spec.phases)byId(entry.id).addEventListener('click',event=>{event.preventDefault();event.stopPropagation();command(entry.id);});byId('run').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();run();});byId('capture').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();if(ready&&!busy)publish({ok:true,revision:spec.revision,fixture:spec.fixture,phases:[snapshot()],errors:[...errors],journal:[...journal],limits});});window.addEventListener('error',event=>errors.push(event.message));window.addEventListener('unhandledrejection',event=>errors.push(String(event.reason)));
window.upstreamTypographyReview=Object.freeze({snapshot,run});try{await customElements.whenDefined('ix-typography');construct();await Promise.all(rows.map(r=>r.node.componentOnReady()));await apply('baseline');ready=true;byId('status').dataset.ready='true';controls(true);publish({ok:true,revision:spec.revision,fixture:spec.fixture,phases:[snapshot()],errors:[...errors],journal:[...journal],limits});}catch(error){errors.push(String(error));byId('status').textContent='Pinned Typography unavailable: '+error;publish({ok:false,error:String(error),errors:[...errors]});}
